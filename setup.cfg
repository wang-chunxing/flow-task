[metadata]
name = flow-task
version = 0.1.0
author = Your Name
author_email = your.email@example.com
description = A Python project for managing tasks and workflows.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/flow-task
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
install_requires =
    flask==2.0.1
    requests==2.25.1
    pandas==1.2.3
    numpy==1.20.1
    sqlalchemy==1.4.15
    psycopg2-binary==2.8.6
    pytest==6.2.2
    pyyaml==5.4.1

[options.packages.find]
where = app
exclude =
    tests/*
